<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Change password — InsightFlow</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <iframe class="bgsite" src="index.html" title="" aria-hidden="true" tabindex="-1"></iframe>
    <div class="bgveil"></div>
    <div class="authpg">
        <a class="back" href="login.html">&larr; Back to sign in</a>
        <div class="pop" style="max-width:520px">
            
            <!-- STEP 1: Welcome Back (Verification Screen) -->
            <div id="step-welcome">
                <h3 style="font-size:1.8rem; margin-bottom:8px">Welcome back</h3>
                <p class="s" style="margin-bottom:20px">You can update your password now if you forgot it.</p>
                
                <div style="background:#f4f6f8; border:1px solid #e5e5e5; padding:10px 16px; border-radius:20px; display:inline-flex; align-items:center; gap:8px; margin-bottom:25px;">
                    <span style="font-size:1.1rem">👤</span>
                    <strong id="user-email-display" style="color:#333; font-size:0.95rem">Verifying token...</strong>
                </div>

                <p class="err" id="w-err" role="alert"></p>

                <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;">
                    <button class="btn" id="btn-update-pwd" style="color:var(--wine); border:1px solid var(--wine);">Update password</button>
                    <button class="btn solid" id="btn-continue" style="background:var(--wine);">Continue</button>
                </div>
            </div>

            <!-- STEP 2: Change Password Screen -->
            <div id="step-reset" hidden>
                <h3 style="font-size:1.8rem; margin-bottom:8px">Change password</h3>
                <p class="s" style="margin-bottom:20px">Create a new, strong password that you don't use for other websites.</p>

                <div style="background:#f4f6f8; border:1px solid #e5e5e5; padding:8px 14px; border-radius:20px; display:inline-flex; align-items:center; gap:8px; margin-bottom:20px;">
                    <span style="font-size:1rem">👤</span>
                    <strong id="reset-email-display" style="color:#333; font-size:0.9rem"></strong>
                </div>

                <form id="rf-pwd">
                    <div class="f">
                        <label for="np">Create password</label>
                        <div class="pw">
                            <input id="np" type="password" required minlength="8" placeholder="8+ chars, 1 uppercase, 1 digit, 1 symbol">
                            <button type="button" class="sh" data-t="np">Show</button>
                        </div>
                    </div>
                    <div class="f">
                        <label for="cp">Confirm password</label>
                        <div class="pw">
                            <input id="cp" type="password" required minlength="8" placeholder="Repeat new password">
                            <button type="button" class="sh" data-t="cp">Show</button>
                        </div>
                    </div>
                    <p class="err" id="r-err" role="alert"></p>
                    
                    <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
                        <button type="button" class="btn" id="btn-skip">Skip</button>
                        <button type="submit" class="btn solid" id="btn-save" style="background:var(--wine);">Save password</button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script src="api.js"></script>
    <script>
        const $ = s => document.querySelector(s);
        const q = new URLSearchParams(location.search);
        const token = q.get('token');
        const STRONG_PWD_REGEX = /^(?=.*[A-Z])(?=.*\d)(?=.*[@\$!%*?&])[A-Za-z\d@$!\%*?&]{8,}$/;

        if (!token) {
            alert('Invalid or missing password reset link.');
            location.href = 'login.html';
        }

        // Token verification on page load
        (async () => {
            try {
                const res = await IF.api(`/api/users/verify-reset-token?token=${encodeURIComponent(token)}`);
                $('#user-email-display').textContent = res.email;
                $('#reset-email-display').textContent = res.email;
            } catch (err) {
                $('#w-err').textContent = err.message || 'Reset link expired. Please request a new one.';
                $('#btn-update-pwd').disabled = true;
                $('#btn-continue').disabled = true;
            }
        })();

        $('#btn-continue').onclick = () => { location.href = 'login.html'; };
        $('#btn-skip').onclick = () => { location.href = 'login.html'; };

        $('#btn-update-pwd').onclick = () => {
            $('#step-welcome').hidden = true;
            $('#step-reset').hidden = false;
        };

        document.querySelectorAll('.sh').forEach(b => b.onclick = () => {
            const i = $('#' + b.dataset.t), s = i.type === 'password';
            i.type = s ? 'text' : 'password';
            b.textContent = s ? 'Hide' : 'Show';
        });

        $('#rf-pwd').onsubmit = async e => {
            e.preventDefault();
            const er = $('#r-err'), btn = $('#btn-save');
            er.style.color = '';
            er.textContent = '';

            const np = $('#np').value;
            if (!STRONG_PWD_REGEX.test(np)) {
                return er.textContent = 'Password must be at least 8 characters long and contain 1 uppercase letter, 1 digit, and 1 special symbol (@\$!%*?&).';
            }
            if (np !== $('#cp').value) {
                return er.textContent = 'Passwords do not match.';
            }

            btn.disabled = true;
            btn.textContent = 'Saving…';

            try {
                const resp = await IF.api('/api/users/reset-password', {
                    method: 'POST',
                    json: { token: token, new_password: np }
                });
                
                er.style.color = '#2e7d32';
                er.textContent = resp.message;

                setTimeout(() => {
                    location.href = 'login.html?tab=login';
                }, 2000);

            } catch (ex) {
                er.textContent = ex.message;
                btn.disabled = false;
                btn.textContent = 'Save password';
            }
        };
    </script>
</body>

</html>
