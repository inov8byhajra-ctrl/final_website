<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manager sign up — InsightFlow</title><link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css"><script src="js/loader.js"></script></head>
<body><iframe class="bgsite" src="index.html" title="" aria-hidden="true" tabindex="-1"></iframe><div class="bgveil"></div>
<div class="authpg"><a class="back" href="login.html" style="color:#fff">&larr; Back to sign in</a><div class="pop">
<h3>Join your team</h3><p class="s">Enter the email and 6-digit code from your CFO's invitation.</p>
<form id="mf">
<div class="f"><label for="me">Company email</label><input id="me" type="email" required placeholder="name@company.com"></div>
<div class="f"><label for="mo">Verification code</label><input id="mo" required inputmode="numeric" maxlength="6" pattern="\d{6}" placeholder="6-digit code"></div>
<div class="f"><label for="m1">Password</label><input id="m1" type="password" required minlength="8" placeholder="Choose a password"></div>
<div class="f"><label for="m2">Confirm password</label><input id="m2" type="password" required placeholder="Repeat password"></div>
<p class="err" id="er" role="alert"></p><button class="btn solid">Create account</button></form>
</div></div><script src="js/common.js"></script><script src="js/api.js"></script><script src="js/msignup.js"></script></body></html>
