<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home — InsightFlow</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/loader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="app">
    <nav class="side-nav" id="sn" aria-label="Main"></nav>
    <main class="pg" id="pg"></main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
  <script>
    page('Home', (user) => {
      const files = st.get('if_files', []);
      const unified = st.get('if_unified', false);
      const stats = [
        ['Revenue', '$248.6K', '↗ 18.4% vs last month'],
        ['Files', files.length, unified ? 'Unified' : 'Not merged yet'],
        ['Forecast accuracy', '94.2%', 'Model is healthy'],
        ['Risk', 'Low', 'No drift detected']
      ];

      return `
        ${user.role === 'cfo' ? '<div class="home-top"><a class="btn solid inv-btn" href="invite.html">+ Invite manager</a></div>' : ''}

        <div class="hg home-hg">
          <div>
            <span class="eye">Intelligent business analytics</span>
            <h1 class="ht">Insight-Flow</h1>
            <p class="lead">Upload your CSV or XLSX files and turn raw business data into live dashboards, AI forecasts, drift detection and proactive recommendations.</p>
            <form class="ask" id="hf" style="margin:18px 0 10px">
              <input id="hs" placeholder="Ask anything about your business analytics...">
              <button class="btn solid">Ask ↗</button>
            </form>
            <small style="color:var(--mut)">Try: “Why did revenue drop last month?”</small>
            <p class="tags"><span class="tag">AI Forecasting</span> <span class="tag">Drift Detection</span> <span class="tag">Live Analytics</span> <span class="tag">${files.length} files · ${unified ? 'Unified' : 'Not merged'}</span></p>
          </div>

          <div class="stage2">
            <div class="fx" style="top:0;left:0">✦ Revenue trend detected</div>
            <div class="win home-card"><div class="in">
              <small class="eye">Business overview</small>
              <h3>Performance</h3>
              <strong style="font:600 2.2rem var(--disp);color:var(--wine)">$248.6K</strong> <small>↗ 18.4% vs last month</small>
              ${line(REV)}
              <div class="tri">
                <div class="cr"><small>Revenue</small><b style="font-size:1.2rem">+24.8%</b></div>
                <div class="cr"><small>Forecast</small><b style="font-size:1.2rem">94.2%</b></div>
                <div class="cr"><small>Risk</small><b style="font-size:1.2rem">Low</b></div>
              </div>
            </div></div>
          </div>
        </div>

        <div class="mini">${stats.map(([label, value, note]) => `<div class="sc"><small>${label}</small><b>${value}</b><span>${note}</span></div>`).join('')}</div>

        <div class="pn"><h3>Where to next</h3><div class="qa">
          <a href="data.html"><b>Upload data</b><span>Add monthly or quarterly CSV and XLSX files.</span></a>
          <a href="ask.html"><b>Ask a question</b><span>Get answers from your own data in plain English.</span></a>
          <a href="pnl.html"><b>Open Profit &amp; Loss</b><span>Revenue, costs and profit, month by month.</span></a>
        </div></div>`;
    }, () => {
      draw();
      // search box -> opens the Ask page with the question
      $('#hf').onsubmit = e => {
        e.preventDefault();
        location.href = 'ask.html?q=' + encodeURIComponent($('#hs').value);
      };
    });

    // "Invitation sent" message after inviting a manager
    if (location.search.includes('invited=1')) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.setAttribute('role', 'status');
      toast.textContent = 'Invitation sent to your regional manager.';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
      history.replaceState(null, '', 'home.html');
    }
  </script>
</body>
</html>
