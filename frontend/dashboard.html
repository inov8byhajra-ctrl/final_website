<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard — InsightFlow</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/loader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="app">
    <nav class="side-nav" id="sn" aria-label="Main"></nav>
    <main class="pg" id="pg"></main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
  <script>
    page('Dashboard', user => {
      const cards = [
        ['Total revenue', '$124,532', '↑ 12.5% vs last month', '+'],
        ['Total customers', '8,420', '↑ 8.3% vs last month', '☺'],
        ['Profit margin', '18.6%', '↑ 2.4% vs last month', '%'],
        ['Anomalies detected', '3', '↑ 2 vs last week', '▲']
      ];
      const regions = [['North America', 42, '#2A090E'], ['Europe', 28, '#9A2C3E'], ['Asia', 18, '#D9777F'], ['Others', 12, '#d8c7c3']];

      return `
        <div class="bn">
          <div>
            <small class="eye">Good morning, ${esc(user.n.split(' ')[0])}</small>
            <h1 class="ht" style="font-size:2.3rem">Turn your data into actionable insights</h1>
            <p>Explore, analyze and make smarter business decisions with the power of AI.</p>
          </div>
          <div>${line(REV, [150, 158, 165])}</div>
        </div>

        <div class="mini">${cards.map(([label, value, note, icon]) => `
          <div class="sc">
            <div class="kr"><span class="ic">${icon}</span><div><small>${label}</small><b>${value}</b></div></div>
            <span>${note}</span>
          </div>`).join('')}</div>

        <div class="trio">
          <div class="pn">
            <div style="display:flex;justify-content:space-between">
              <h3>Sales trend</h3>
              <div class="seg" id="sg"><button class="on" data-n="6">6 Months</button><button data-n="9">12 Months</button></div>
            </div>
            <div id="tc">${line(REV.slice(0, 6))}</div>
          </div>

          <div class="pn">
            <h3>Revenue by region</h3>
            <div class="donut"></div>
            ${regions.map(([name, pct, color]) => `<div class="lg"><span><i style="background:${color}"></i>${name}</span><b>${pct}%</b></div>`).join('')}
          </div>

          <div class="dk">
            <h3>AI Advisory</h3>
            <p>Based on recent trends, your sales are likely to grow 8–12% next quarter. Consider increasing inventory for North America.</p>
            <p style="margin-top:80px"><a class="btn" href="advisory.html" style="display:block;text-align:center">View full report</a></p>
          </div>
        </div>

        <div class="pn"><h3>Audit log</h3><div class="tw"><table>
          <tr><th>Source</th><th>Event</th><th class="r">Impact</th><th>Status</th></tr>
          <tr><td>Stripe</td><td>Renewal batch #4409</td><td class="r">+$48,220</td><td><span class="tag">Settled</span></td></tr>
          <tr><td>AWS</td><td>Cluster autoscaling</td><td class="r">-$3,412</td><td><span class="tag">Flagged</span></td></tr>
          <tr><td>NetSuite</td><td>EMEA consolidation</td><td class="r">+$31,900</td><td><span class="tag">Reconciled</span></td></tr>
        </table></div></div>`;
    }, () => {
      draw();
      // 6 / 12 months switch
      segmented('#sg', n => {
        $('#tc').innerHTML = line(REV.slice(0, n));
        draw();
      });
    });
  </script>
</body>
</html>
