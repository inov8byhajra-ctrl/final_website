<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Profit & Loss — InsightFlow</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/loader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="app">
    <nav class="side-nav" id="sn" aria-label="Main"></nav>
    <main class="pg" id="pg"></main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
  <script>
    page('PL', () => {
      const rows = pl();                                        // [month, revenue, cogs, gross, opex, net]
      const sum = col => rows.reduce((total, r) => total + r[col], 0);
      const revenue = sum(1), cogs = sum(2), gross = sum(3), net = sum(5);
      const last = rows[rows.length - 1];
      const margin = (net / revenue * 100).toFixed(1);
      const maxRev = Math.max(...REV);

      // tiny line under each stat card
      const spark = values => {
        const max = Math.max(...values), min = Math.min(...values);
        const pts = values.map((v, i) => `${i * 100 / (values.length - 1)},${28 - (v - min) / (max - min || 1) * 24}`).join(' ');
        return `<svg viewBox="0 0 100 30" preserveAspectRatio="none"><polyline class="lp" fill="none" stroke="#9A2C3E" stroke-width="1.6" points="${pts}"/></svg>`;
      };

      const stats = [
        ['Total revenue', revenue, REV],
        ['COGS', cogs, COG],
        ['Gross profit', gross, rows.map(r => r[3])],
        ['Net profit', net, rows.map(r => r[5])]
      ];
      const chips = [`$${revenue}K revenue`, `+${((REV[REV.length - 1] / REV[0] - 1) * 100).toFixed(1)}% since ${M[0]}`, `${margin}% margin`];

      return `
        <div class="hg">
          <div>
            <h1 class="ht">Profit and loss</h1>
            <p class="lead">Turn uploaded business data into a clear financial picture. Revenue, COGS, gross profit and net profit are calculated automatically ($K).</p>
            <div class="win"><div class="in">
              <small class="eye">Current net profit · ${M[M.length - 1]}</small>
              <strong style="display:block;font:600 2.6rem var(--disp);color:var(--wine)">$${last[5]}K</strong>
              <small>after operating costs &amp; taxes</small>
              <div class="prog" style="margin:14px 0 6px"><i style="width:${(net / revenue * 100).toFixed(0)}%"></i></div>
              <small>Net margin ${margin}%</small>
            </div></div>
          </div>
          <div class="stage2">${ORB(chips, 'Net profit', '$' + net + 'K')}</div>
        </div>

        <div class="mini">${stats.map(([label, total, values]) => `<div class="sc"><small>${label}</small><b>$${total}K</b>${spark(values)}</div>`).join('')}</div>

        <div class="pn">
          <h3>Monthly P&amp;L breakdown</h3>
          <div class="bars2">${rows.map(r => `<div><i class="b1" style="height:${r[3] / maxRev * 100}%"></i><i class="b2" style="height:${r[1] / maxRev * 100}%"></i></div>`).join('')}</div>
          <div class="bl">${M.map(m => `<span>${m}</span>`).join('')}</div>
        </div>

        <div class="pn"><small class="eye">Cache status</small> <span class="tag">Redis cache: HIT</span> <small>Response 4ms · cached 12 min ago</small></div>`;
    }, () => {
      draw();
      gsap.from('.bars2 i', { scaleY: 0, transformOrigin: 'bottom', duration: .9, stagger: .05, delay: .4, ease: 'power3.out', clearProps: 'transform' });
    });
  </script>
</body>
</html>
