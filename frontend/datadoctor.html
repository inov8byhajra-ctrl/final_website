<body>
    <div id="app">
        <nav class="side-nav" id="sn" aria-label="Main"></nav>
        <main class="pg" id="pg"></main>
    </div>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script>
        page('Doctor', () => {
            const f = st.get('if_files', []); const iss = [['Missing values', '12 blank cells in revenue column', 'Medium'], ['Duplicate rows', '4 repeated order IDs', 'High'], ['Type mismatch', 'Date stored as text in 2 files', 'Low']];
            return `<h1 class="ht">Data Doctor</h1><p class="lead">Scans your uploaded files for missing values, duplicates and wrong types.</p>${kp([['Files scanned', f.length, 'From Data page'], ['Issues found', iss.length, 'Needs review'], ['Health score', '86%', 'Good']])}
<div class="pn"><h3>Issues</h3><div class="tw"><table><tr><th>Check</th><th>Detail</th><th>Severity</th></tr>${iss.map(i => `<tr><td>${i[0]}</td><td>${i[1]}</td><td><span class="tag">${i[2]}</span></td></tr>`).join('')}</table></div><p><a class="btn" href="data.html">Upload files</a> <a class="btn solid" href="unify.html">Continue to Unify</a></p></div>`
        })
    </script>
