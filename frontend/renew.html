<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renew license — InsightFlow</title><link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css"><script src="js/loader.js"></script></head>
<body><iframe class="bgsite" src="index.html" title="" aria-hidden="true" tabindex="-1"></iframe><div class="bgveil"></div>
<div class="authpg"><a class="back" href="login.html" style="color:#fff">&larr; Back to sign in</a><div class="pop">
<h3>Renew your license</h3><p class="s">Submit your new license for admin review.</p>
<form id="nf">
<div class="f"><label for="ne">Email</label><input id="ne" type="email" required></div>
<div class="f"><label for="np">Password</label><input id="np" type="password" required></div>
<div class="f"><label for="nl">License number</label><input id="nl" required></div>
<div class="f"><label for="ni">Issue date</label><input id="ni" type="date" required></div>
<div class="f"><label for="nx">Expiry date</label><input id="nx" type="date" required></div>
<div class="f"><label for="nd">License document (PDF/JPG/PNG, max 5 MB)</label><input id="nd" type="file" accept=".pdf,.png,.jpg,.jpeg" required></div>
<p class="err" id="er" role="alert"></p><button class="btn solid">Submit renewal</button></form>
</div></div><script src="js/common.js"></script><script src="js/api.js"></script><script src="js/renew.js"></script></body></html>
