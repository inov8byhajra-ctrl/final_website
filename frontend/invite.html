<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Invite regional manager — InsightFlow</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/loader.js"></script>
</head>
<body>
  <iframe class="bgsite" src="home.html" title="" aria-hidden="true" tabindex="-1"></iframe>
  <div class="bgveil"></div>

  <div class="authpg">
    <a class="back" href="home.html" style="color:#fff">&larr; Back to home</a>

    <div class="pop">
      <h3>Add your team</h3>
      <p class="s">Invite a regional manager to your InsightFlow workspace.</p>
      <form id="inf">
        <div class="f"><label for="mn">Manager name</label><input id="mn" required placeholder="Full name"></div>
        <div class="f"><label for="me">Company email</label><input id="me" type="email" required placeholder="name@company.com"></div>
        <div class="f"><label for="mr">Region</label><input id="mr" required placeholder="e.g. North America, Punjab, EMEA"></div>
        <p class="err" id="ie" role="alert"></p>
        <button class="btn solid">Invite regional manager</button>
      </form>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/invite.js"></script>
</body>
</html>
