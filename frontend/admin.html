<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CFO approvals — InsightFlow</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="design.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>

<body>
    <div id="app">
        <nav class="side-nav" id="sn" aria-label="Main"></nav>
        <main class="pg" id="pg"></main>
    </div>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script>
        const BTN = 'padding:7px 16px;font-size:.85rem';
        const BLOCK_BTN = 'padding:4px 12px;font-size:.8rem;color:#fff;border:none;border-radius:4px;cursor:pointer;';
        const fd = d => d ? new Date(d + 'T00:00:00').toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
        const who = c => `<b>${esc(c.name || '—')}</b><br><small style="color:var(--mut)">${esc(c.email)}</small>`;
        const co = c => `<b>${esc(c.company_name || '—')}</b><br><small style="color:var(--mut)">@${esc(c.company_domain || '')}</small>`;

        page('Admin', u => `<div class="home-top"></div>
<div><span class="eye">Admin console</span><h1 class="ht" style="font-size:2.3rem">CFO approvals</h1><p class="lead">Check each CFO's license document, then approve, reject or blacklist. They are emailed when you approve or reject.</p></div>
<div class="mini" style="margin-top:18px">
<div class="sc"><small>Pending review</small><b id="k1">–</b><span>Waiting for your decision</span></div>
<div class="sc"><small>Approved CFOs</small><b id="k2">–</b><span>Can access their dashboard</span></div>
<div class="sc"><small>Regional managers</small><b id="k3">–</b><span>Invited by CFOs and verified</span></div>
<div class="sc"><small>Live updates</small><b id="k4">Connecting…</b><span>New sign-ups appear instantly</span></div></div>
<div class="pn"><h3>Pending approvals</h3><div class="tw" id="pt"><p style="color:var(--mut)">Loading…</p></div></div>
<div class="pn"><h3>Approved CFOs</h3><div class="tw" id="at"><p style="color:var(--mut)">Loading…</p></div></div>
<div class="pn"><h3>Regional Managers</h3><div class="tw" id="rm"><p style="color:var(--mut)">Loading…</p></div></div>
<div class="pn"><h3>Blacklisted companies</h3><div class="tw" id="bl"><p style="color:var(--mut)">Loading…</p></div></div>`,
            () => {
                const setLive = on => { $('#k4').textContent = on ? 'Connected' : 'Reconnecting…' };

                async function load() {
                    let d, managers = [], blacklist = [];
                    try {
                        d = await IF.api('/admin/cfos', { auth: true });
                        managers = await IF.api('/admin/regional-managers', { auth: true }).catch(() => []);
                        blacklist = await IF.api('/admin/blacklist', { auth: true }).catch(() => []);
                    } catch (e) {
                        $('#pt').innerHTML = `<p class="err">${esc(e.message)}</p>`;
                        return;
                    }

                    $('#k1').textContent = d.stats.pending;
                    $('#k2').textContent = d.stats.approved;
                    $('#k3').textContent = d.stats.managers;

                    const pend = d.cfos.filter(c => !c.is_approved), appr = d.cfos.filter(c => c.is_approved);

                    // 1. Pending CFOs
                    $('#pt').innerHTML = pend.length ? `<table><tr><th>CFO</th><th>Company</th><th>License no.</th><th>Issued</th><th>Expires</th><th>Document</th><th class="r">Decision</th></tr>` +
                        pend.map(c => `<tr>
<td>${who(c)}</td>
<td>${co(c)}</td>
<td>${esc(c.license_number || '—')}</td>
<td>${fd(c.license_issue_date)}</td>
<td>${fd(c.license_expiry_date)}</td>
<td>${c.has_license_file ? `<button class="btn" style="${BTN}" data-a="view" data-id="${c.id}">View license</button>` : '—'}</td>
<td class="r"><select id="exp-${c.id}" data-license="${c.license_expiry_date || ''}" style="padding:6px 8px;font-size:.85rem;border-radius:8px;border:1px solid #e5e5e5"><option value="license">Until license expires</option><option value="6">6 months</option><option value="12">1 year</option><option value="24">2 years</option></select> <button class="btn solid" style="${BTN}" data-a="ok" data-id="${c.id}">Approve</button> <button class="btn" style="${BTN}" data-a="no" data-id="${c.id}">Reject</button> <button class="btn" style="${BTN};color:#ba1a1a" data-a="bl" data-id="${c.id}">Blacklist</button></td>
</tr>`).join('') + `</table>`
                        : '<p style="color:var(--mut)">No CFOs are waiting for approval. You are all caught up.</p>';

                    // 2. Approved CFOs
                    $('#at').innerHTML = appr.length ? `<table><tr><th>CFO</th><th>Company</th><th>License no.</th><th>License expires</th><th>Status</th><th>Action</th></tr>` +
                        appr.map(c => `<tr id="user-row-${c.id}">
<td>${who(c)}</td><td>${co(c)}</td><td>${esc(c.license_number || '—')}</td><td>${fd(c.license_expiry_date)}</td>
<td><span class="tag" id="status-tag-${c.id}" data-ok="Approved">${c.is_blocked ? 'Blocked' : 'Approved'}</span></td>
<td><button class="btn" id="block-btn-${c.id}" style="${BLOCK_BTN}background:${c.is_blocked ? '#2e7d32' : '#4A0E17'}" onclick="toggleBlockUser(${c.id})">${c.is_blocked ? 'Unblock' : 'Block'}</button></td></tr>`).join('') + `</table>`
                        : '<p style="color:var(--mut)">No approved CFOs yet.</p>';

                    // 3. Regional Managers
                    $('#rm').innerHTML = managers.length ? `<table><tr><th>Manager</th><th>Region</th><th>Company</th><th>Status</th><th>Action</th></tr>` +
                        managers.map(m => `<tr id="user-row-${m.id}">
<td>${who(m)}</td>
<td>${esc(m.region || '—')}</td>
<td><b>${esc(m.cfo_company_name || m.company_name || '—')}</b></td>
<td><span class="tag" id="status-tag-${m.id}" data-ok="Verified" style="background:#f4f6f8;color:#333;border:1px solid #e5e5e5">${m.is_blocked ? 'Blocked' : 'Verified'}</span></td>
<td><button class="btn" id="block-btn-${m.id}" style="${BLOCK_BTN}background:${m.is_blocked ? '#2e7d32' : '#4A0E17'}" onclick="toggleBlockUser(${m.id})">${m.is_blocked ? 'Unblock' : 'Block'}</button></td>
</tr>`).join('') + `</table>`
                        : '<p style="color:var(--mut)">No regional managers registered yet.</p>';

                    // 4. Blacklisted companies
                    $('#bl').innerHTML = blacklist.length ? `<table><tr><th>Company</th><th>Domain</th><th>Email</th><th>License no.</th><th>Reason</th><th class="r">Action</th></tr>` +
                        blacklist.map(b => `<tr><td><b>${esc(b.company_name || '—')}</b></td><td>${esc(b.company_domain || '—')}</td><td>${esc(b.email || '—')}</td><td>${esc(b.license_number || '—')}</td><td>${esc(b.reason || '—')}</td><td class="r"><button class="btn" style="${BTN}" data-a="unbl" data-id="${b.id}">Remove</button></td></tr>`).join('') + `</table>`
                        : '<p style="color:var(--mut)">No blacklisted companies.</p>';
                }

                $('#pg').addEventListener('click', async e => {
                    const b = e.target.closest('button[data-a]'); if (!b) return; const id = +b.dataset.id, a = b.dataset.a;
                    try {
                        if (a === 'view') return await IF.openProtectedFile('/admin/download-license/' + id);

                        if (a === 'bl') {
                            if (!confirm('Blacklist this company? The registration is deleted and they cannot sign up again.')) return;
                            b.closest('tr').querySelectorAll('button').forEach(x => x.disabled = true);
                            const r = await IF.api('/admin/blacklist', { method: 'POST', auth: true, json: { cfo_id: id, reason: 'Fraudulent registration' } });
                            IF.toast(r.message);
                            return load();
                        }

                        if (a === 'unbl') {
                            if (!confirm('Remove this company from the blacklist?')) return;
                            const r = await IF.api('/admin/blacklist/' + id, { method: 'DELETE', auth: true });
                            IF.toast(r.message);
                            return load();
                        }

                        if (a === 'no' && !confirm('Reject this registration? The CFO is emailed and the account is removed.')) return;
                        b.closest('tr').querySelectorAll('button').forEach(x => x.disabled = true);
                        let expiry = null;
                        if (a === 'ok') {
                            const sel = document.getElementById('exp-' + id);
                            if (sel.value === 'license' && sel.dataset.license) expiry = sel.dataset.license + 'T23:59:59';
                            else if (sel.value !== 'license') { const d = new Date(); d.setMonth(d.getMonth() + +sel.value); expiry = d.toISOString(); }
                        }
                        const r = await IF.api('/admin/approve-license', { method: 'POST', auth: true, json: { cfo_id: id, is_valid: a === 'ok', expiry_date: expiry } });
                        IF.toast(r.message + (r.email_sent === false ? ' (email could not be sent)' : a === 'ok' ? ' Approval email sent.' : ''), r.email_sent === false);
                        load();
                    } catch (ex) { IF.toast(ex.message, true); load(); }
                });

                function live() {
                    const s = IF.getSession(); if (!s) return; let ws;
                    try {
                        ws = new WebSocket(IF.wsUrl('/admin/ws?token=' + encodeURIComponent(s.token)))
                    } catch (e) { return }
                    ws.onopen = () => setLive(true);
                    ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data) } catch (e) { m = { message: ev.data } } IF.toast(m.message || 'New activity'); load(); };
                    ws.onclose = () => { setLive(false); setTimeout(live, 3000); };
                }
                load(); live();
            });

        // Block / unblock for approved CFOs and managers
        async function toggleBlockUser(userId) {
            try {
                const response = await IF.api(`/admin/users/${userId}/toggle-block`, { method: 'PATCH', auth: true });
                IF.toast(response.message || 'User block status updated successfully.');

                const btn = document.getElementById(`block-btn-${userId}`);
                const tag = document.getElementById(`status-tag-${userId}`);

                if (btn) {
                    btn.textContent = response.is_blocked ? 'Unblock' : 'Block';
                    btn.style.background = response.is_blocked ? '#2e7d32' : '#4A0E17';
                }
                if (tag) tag.textContent = response.is_blocked ? 'Blocked' : tag.dataset.ok;
            } catch (error) {
                IF.toast(`Error: ${error.message}`, true);
            }
        }

        // Desktop popup for unread admin notifications
        async function loadAdminNotifications() {
            try {
                const notifications = await IF.api('/admin/notifications', { auth: true });
                if (notifications && notifications.length && 'Notification' in window && Notification.permission === 'granted') {
                    new Notification('New Alert in InsightFlow', { body: notifications[0].message });
                }
            } catch (error) {
                console.error('Error loading notifications:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAdminNotifications();
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        });
    </script>
</body>

</html>
