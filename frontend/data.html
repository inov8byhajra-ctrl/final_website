<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Data — InsightFlow</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="design.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>

<body>
    <div id="app">
        <nav class="side-nav" id="sn" aria-label="Main"></nav>
        <main class="pg" id="pg"></main>
    </div>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script>
        page('Data', () => `<div class="hg"><div><h1 class="ht">Data Ingestion</h1><p class="lead">Upload CSV, XLS or XLSX. Every file is validated on arrival, then shows up in Unify.</p><a class="btn solid" href="unify.html">Explore the flow ↗</a></div><div class="stage2">${BALL()}<div class="fx" style="top:10%;right:6%">98.7% validated</div><div class="fx" style="bottom:8%;left:8%">3.2× faster review</div></div></div>
<div class="mini" style="grid-template-columns:repeat(3,1fr)"><div class="sc"><small>Total rows ingested</small><b>47K+</b><span>Across 3 datasets</span></div><div class="sc"><small>Validation pass rate</small><b>98.7%</b><span>Schema, nulls, types</span></div><div class="sc"><small>Storage backend</small><b>PostgreSQL</b><span>Cache enabled</span></div></div>
<h2 style="text-align:center;color:var(--wine);margin:26px 0 14px">Upload a dataset</h2>
<label class="up" id="dz"><input type="file" id="fi" multiple accept=".csv,.xls,.xlsx" hidden><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#F7EAE6" stroke-width="1.8" stroke-linecap="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 17v3h16v-3"/></svg><br><b>Drop files here, or click to choose</b><br><span>CSV</span><span>XLS</span><span>XLSX</span></label>
<div class="pn" style="margin-top:18px"><h3>Uploaded files</h3><div class="tw"><table id="ft"><tr><th>File</th><th>Rows</th><th>Checks</th><th>Status</th></tr></table></div><p><button class="btn" id="cl">Clear list</button> <a class="btn solid" href="unify.html">Continue to Unify</a></p></div>`,
            () => {
                const d = $('#dz'), f = $('#fi'), draw1 = x => $('#ft').insertAdjacentHTML('beforeend', `<tr><td>${esc(x.name)}</td><td>${x.rows}</td><td>${x.ok ? 'Schema, nulls, types' : 'Unsupported type'}</td><td><span class="tag">${x.ok ? 'Passed' : 'Rejected'}</span></td></tr>`);
                st.get('if_files', []).forEach(draw1);
                async function add(fl) { const a = st.get('if_files', []); for (const x of fl) { const ok = /\.(csv|xls|xlsx)$/i.test(x.name); let rows = '-'; if (ok && /\.csv$/i.test(x.name)) { rows = Math.max(0, (await x.text()).trim().split(/\r?\n/).length - 1) } else if (ok) rows = 'Excel'; const r = { name: x.name, rows, ok }; a.push(r); draw1(r) } st.set('if_files', a); st.set('if_unified', false) }
                d.ondragover = e => { e.preventDefault(); d.classList.add('h') }; d.ondragleave = () => d.classList.remove('h'); d.ondrop = e => { e.preventDefault(); d.classList.remove('h'); add(e.dataTransfer.files) }; f.onchange = () => add(f.files);
                $('#cl').onclick = () => { st.set('if_files', []); st.set('if_unified', false); location.reload() }
            })
    </script>
</body>

</html>
