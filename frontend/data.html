<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Data — InsightFlow</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/loader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="app">
    <nav class="side-nav" id="sn" aria-label="Main"></nav>
    <main class="pg" id="pg"></main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
  <script>
    page('Data', () => `
      <div class="hg">
        <div>
          <h1 class="ht">Data Ingestion</h1>
          <p class="lead">Upload CSV, XLS or XLSX. Every file is validated on arrival, then shows up in Unify.</p>
          <a class="btn solid" href="unify.html">Explore the flow ↗</a>
        </div>
        <div class="stage2">
          ${BALL()}
          <div class="fx" style="top:10%;right:6%">98.7% validated</div>
          <div class="fx" style="bottom:8%;left:8%">3.2× faster review</div>
        </div>
      </div>

      <div class="mini" style="grid-template-columns:repeat(3,1fr)">
        <div class="sc"><small>Total rows ingested</small><b>47K+</b><span>Across 3 datasets</span></div>
        <div class="sc"><small>Validation pass rate</small><b>98.7%</b><span>Schema, nulls, types</span></div>
        <div class="sc"><small>Storage backend</small><b>PostgreSQL</b><span>Cache enabled</span></div>
      </div>

      <h2 style="text-align:center;color:var(--wine);margin:26px 0 14px">Upload a dataset</h2>
      <label class="up" id="dz">
        <input type="file" id="fi" multiple accept=".csv,.xls,.xlsx" hidden>
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#F7EAE6" stroke-width="1.8" stroke-linecap="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 17v3h16v-3"/></svg><br>
        <b>Drop files here, or click to choose</b><br><span>CSV</span><span>XLS</span><span>XLSX</span>
      </label>

      <div class="pn" style="margin-top:18px">
        <h3>Uploaded files</h3>
        <div class="tw"><table id="ft"><tr><th>File</th><th>Rows</th><th>Checks</th><th>Status</th></tr></table></div>
        <p><button class="btn" id="cl">Clear list</button> <a class="btn solid" href="unify.html">Continue to Unify</a></p>
      </div>`,
    () => {
      const dropBox = $('#dz'), input = $('#fi'), table = $('#ft');

      // add one row to the "Uploaded files" table
      const addRow = f => table.insertAdjacentHTML('beforeend', `<tr>
        <td>${esc(f.name)}</td><td>${f.rows}</td>
        <td>${f.ok ? 'Schema, nulls, types' : 'Unsupported type'}</td>
        <td><span class="tag">${f.ok ? 'Passed' : 'Rejected'}</span></td></tr>`);

      st.get('if_files', []).forEach(addRow);   // show files uploaded earlier

      async function addFiles(list) {
        const saved = st.get('if_files', []);
        for (const file of list) {
          const ok = /\.(csv|xls|xlsx)$/i.test(file.name);
          let rows = '-';
          if (ok && /\.csv$/i.test(file.name)) rows = Math.max(0, (await file.text()).trim().split(/\r?\n/).length - 1);   // count CSV rows
          else if (ok) rows = 'Excel';
          const item = { name: file.name, rows, ok };
          saved.push(item);
          addRow(item);
        }
        st.set('if_files', saved);
        st.set('if_unified', false);
      }

      dropBox.ondragover = e => { e.preventDefault(); dropBox.classList.add('h') };
      dropBox.ondragleave = () => dropBox.classList.remove('h');
      dropBox.ondrop = e => { e.preventDefault(); dropBox.classList.remove('h'); addFiles(e.dataTransfer.files) };
      input.onchange = () => addFiles(input.files);

      $('#cl').onclick = () => {
        st.set('if_files', []);
        st.set('if_unified', false);
        location.reload();
      };
    });
  </script>
</body>
</html>
